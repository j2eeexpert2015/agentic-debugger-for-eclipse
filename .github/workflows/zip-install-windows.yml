# Install from the distributable ZIP, not Maven's unpacked target/repository.
# Complements integration-windows.yml, which runs FullSuite on ci/** pushes.
name: ZIP install and smoke tests (Windows)

on:
  push:
    branches: ['ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zip-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ECLIPSE_RELEASE: '2025-12'
  ECLIPSE_HOME: 'C:\ci\eclipse'
  BRIDGE_PORT: '21766'

jobs:
  zip-install:
    name: ZIP install / Windows / Eclipse 2025-12
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Restore pristine test Eclipse
        id: eclipse-cache
        uses: actions/cache/restore@v5
        with:
          path: C:\ci\eclipse
          key: eclipse-java-${{ env.ECLIPSE_RELEASE }}-R-win32-x86_64

      - name: Download test Eclipse if not cached
        if: steps.eclipse-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "eclipse-java-$env:ECLIPSE_RELEASE-R-win32-x86_64.zip"
          $url = "https://download.eclipse.org/technology/epp/downloads/release/$env:ECLIPSE_RELEASE/R/$name"
          New-Item -ItemType Directory -Force -Path C:\ci | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "C:\ci\$name" -MaximumRetryCount 3 -RetryIntervalSec 10
          Expand-Archive -LiteralPath "C:\ci\$name" -DestinationPath C:\ci -Force
          Remove-Item "C:\ci\$name"
          if (-not (Test-Path "$env:ECLIPSE_HOME\eclipsec.exe")) { throw 'Missing Eclipse p2 director' }

      - name: Save pristine test Eclipse to cache
        if: steps.eclipse-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\ci\eclipse
          key: eclipse-java-${{ env.ECLIPSE_RELEASE }}-R-win32-x86_64

      - name: Build installable ZIP
        shell: pwsh
        run: |
          mvn -B -ntp clean package -DskipTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Extract and verify the generated ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zips = @(Get-ChildItem 'eclipse-update-site/target' -Filter 'agentic-debugger-update-site-*.zip' -File)
          if ($zips.Count -ne 1) { throw "Expected exactly one installable ZIP; found $($zips.Count)" }
          $sitePath = Join-Path $env:RUNNER_TEMP 'agentdebug-zip-install-site'
          if (Test-Path $sitePath) { Remove-Item -LiteralPath $sitePath -Recurse -Force }
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath $sitePath
          foreach ($directory in @('features', 'plugins')) {
            if (-not (Test-Path (Join-Path $sitePath $directory))) { throw "ZIP missing $directory/" }
          }
          if (-not (@('content.jar', 'content.xml', 'content.xml.xz') | Where-Object { Test-Path (Join-Path $sitePath $_) })) {
            throw 'ZIP missing p2 content metadata'
          }
          if (-not (@('artifacts.jar', 'artifacts.xml', 'artifacts.xml.xz') | Where-Object { Test-Path (Join-Path $sitePath $_) })) {
            throw 'ZIP missing p2 artifacts metadata'
          }
          $features = @(Get-ChildItem (Join-Path $sitePath 'features') -Filter 'org.learningfromexperience.eclipse.agentdebug.feature_*.jar' -File)
          if ($features.Count -ne 1) { throw "Expected one Agentic Debugger feature JAR; found $($features.Count)" }
          $version = $features[0].BaseName.Substring('org.learningfromexperience.eclipse.agentdebug.feature_'.Length)
          if (-not $version) { throw 'Could not determine feature version from ZIP' }
          "ZIP_FEATURE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zips[0].FullName).Hash
          Write-Host "ZIP: $($zips[0].FullName)"
          Write-Host "SHA256: $hash"
          Write-Host "Feature version: $version"
          @(
            '### Installable ZIP verification', '',
            "- Commit: ${{ github.sha }}",
            "- ZIP: $($zips[0].Name)",
            "- SHA256: $hash",
            "- Feature version: $version"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Install feature from extracted ZIP via Eclipse p2 director
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sitePath = Join-Path $env:RUNNER_TEMP 'agentdebug-zip-install-site'
          $siteUri = ([System.Uri]::new((Resolve-Path $sitePath).Path + [IO.Path]::DirectorySeparatorChar)).AbsoluteUri
          $director = Join-Path $env:ECLIPSE_HOME 'eclipsec.exe'
          $featureId = 'org.learningfromexperience.eclipse.agentdebug.feature.feature.group'
          Write-Host "Installing $featureId/$env:ZIP_FEATURE_VERSION from $siteUri"
          & $director '-nosplash' '-application' 'org.eclipse.equinox.p2.director' '-destination' $env:ECLIPSE_HOME '-repository' $siteUri '-installIU' "$featureId/$env:ZIP_FEATURE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "ZIP installation failed: p2 director exit code $LASTEXITCODE" }
          $roots = & $director '-nosplash' '-application' 'org.eclipse.equinox.p2.director' '-destination' $env:ECLIPSE_HOME '-listInstalledRoots'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect installed Eclipse features' }
          $roots | ForEach-Object { Write-Host $_ }
          if (-not (($roots -join "`n") -match [regex]::Escape($featureId))) {
            throw 'p2 director completed but Agentic Debugger feature is not installed'
          }

      - name: Verify uninstall and reinstall of packaged feature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $director = Join-Path $env:ECLIPSE_HOME 'eclipsec.exe'
          $featureId = 'org.learningfromexperience.eclipse.agentdebug.feature.feature.group'
          $installedFeature = "$featureId/$env:ZIP_FEATURE_VERSION"
          $sitePath = Join-Path $env:RUNNER_TEMP 'agentdebug-zip-install-site'
          $siteUri = ([System.Uri]::new((Resolve-Path $sitePath).Path + [IO.Path]::DirectorySeparatorChar)).AbsoluteUri

          # Eclipse is NOT running yet: perform the p2 operations in the isolated CI installation.
          Write-Host "Uninstalling $featureId"
          & $director '-nosplash' '-application' 'org.eclipse.equinox.p2.director' '-destination' $env:ECLIPSE_HOME '-uninstallIU' $featureId
          if ($LASTEXITCODE -ne 0) { throw "Uninstall failed with exit code $LASTEXITCODE" }
          $roots = @(& $director '-nosplash' '-application' 'org.eclipse.equinox.p2.director' '-destination' $env:ECLIPSE_HOME '-listInstalledRoots')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list installed roots after uninstall' }
          if (($roots -join "`n") -match [regex]::Escape($featureId)) {
            throw 'Agentic Debugger feature is still an installed root after uninstall'
          }
          Write-Host 'Verified: installed root removed after uninstall.'

          # Reinstall from the *same extracted distribution ZIP*, not Maven's target/repository.
          Write-Host "Reinstalling $installedFeature from $siteUri"
          & $director '-nosplash' '-application' 'org.eclipse.equinox.p2.director' '-destination' $env:ECLIPSE_HOME '-repository' $siteUri '-installIU' $installedFeature
          if ($LASTEXITCODE -ne 0) { throw "Reinstall failed with exit code $LASTEXITCODE" }
          $roots = @(& $director '-nosplash' '-application' 'org.eclipse.equinox.p2.director' '-destination' $env:ECLIPSE_HOME '-listInstalledRoots')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list installed roots after reinstall' }
          if (($roots -join "`n") -notmatch [regex]::Escape($installedFeature)) {
            throw "Expected feature/version not installed after reinstall: $installedFeature"
          }
          Write-Host 'Verified: ZIP feature reinstalled successfully.'
          @(
            '### Package lifecycle validation', '',
            '- Initial installation: PASS',
            '- Uninstall (installed root removed): PASS',
            '- Reinstall from extracted ZIP: PASS',
            '- Runtime behavior: checked by the following 21-test regression step'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Configure test workspace
        shell: pwsh
        run: |
          $repo = "${{ github.workspace }}".Replace('\', '/')
          $eclipse = $env:ECLIPSE_HOME.Replace('\', '/')
          @(
            '# Generated by ZIP-install CI; do not commit.',
            "repository=$repo",
            "eclipse=$eclipse",
            'workspace=${LOCALAPPDATA}/AgenticDebugger/java-e2e-workspace',
            "bridgePort=$env:BRIDGE_PORT"
          ) | Set-Content -Path dev-e2e/e2e.properties -Encoding ascii
          java dev-e2e/DevE2E.java config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start Eclipse with ZIP-installed plugin
        shell: pwsh
        run: |
          java dev-e2e/DevE2E.java start --trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run 21 regression tests against ZIP-installed plugin
        shell: pwsh
        run: |
          mvn -B -ntp -pl testing verify -Pintegration-tests '-Dit.test=RegressionSuite' '-Dfixture.post.approved=true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify smoke-test results
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'testing/target/failsafe-reports/failsafe-summary.xml'
          if (-not (Test-Path $path)) { throw 'No Failsafe report from ZIP-install test' }
          $s = ([xml](Get-Content -Raw $path)).'failsafe-summary'
          if ($null -eq $s) { throw 'Invalid Failsafe summary' }
          $n = [int]$s.completed
          $f = [int]$s.failures
          $e = [int]$s.errors
          $skip = [int]$s.skipped
          Write-Host "ZIP-installed regression: $n tests, $f failures, $e errors, $skip skipped"
          @('### ZIP-installed Eclipse regression', '', "| Tests | Failures | Errors | Skipped |", "|---:|---:|---:|---:|", "| $n | $f | $e | $skip |") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if ($n -lt 21 -or $f -ne 0 -or $e -ne 0 -or $skip -ne 0) { throw 'ZIP installation regression verification failed' }

      - name: Collect Eclipse and test logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-out | Out-Null
          $ws = Join-Path $env:LOCALAPPDATA 'AgenticDebugger\java-e2e-workspace'
          if (Test-Path "$ws\.metadata\.log") { Copy-Item "$ws\.metadata\.log" ci-out\eclipse-workspace.log }
          Copy-Item dev-e2e\target\*.log ci-out\ -ErrorAction SilentlyContinue
          if (Test-Path testing\target\failsafe-reports) { Copy-Item testing\target\failsafe-reports ci-out\failsafe-reports -Recurse }

      - name: Upload logs from ZIP installation test
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zip-install-windows-logs-${{ github.run_attempt }}
          path: ci-out/
          retention-days: 14
          if-no-files-found: warn

      - name: Close test Eclipse
        if: always()
        continue-on-error: true
        shell: pwsh
        run: Get-Process eclipse -ErrorAction SilentlyContinue | Stop-Process -Force

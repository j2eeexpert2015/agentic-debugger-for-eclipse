# Sequential CI and controlled release preparation. Never publishes a public release.
# On ci/** pushes and PRs: builds, tests and produces a verified draft-ready artifact only.
# Once this workflow is on default branch main: an explicit manual dispatch can create a DRAFT release.
name: CI release readiness (sequential)

on:
  push:
    branches: ['ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_draft:
        description: 'Create an UNPUBLISHED GitHub Release draft after all tests pass (main only)'
        type: boolean
        required: true
        default: false
      release_tag:
        description: 'For draft only: new tag, e.g. v1.5.0-preview.2 (must not exist)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 'Stage 1: Build and unit tests (JDK 21/25, serial)'
    uses: ./.github/workflows/ci.yml

  integration:
    name: 'Stage 2: FullSuite (43 tests)'
    needs: unit
    uses: ./.github/workflows/integration-windows.yml
    with:
      suite: FullSuite

  packaged:
    name: 'Stage 3: ZIP install, uninstall, reinstall (21 tests)'
    needs: integration
    uses: ./.github/workflows/zip-install-windows.yml

  candidate:
    name: 'Stage 4: Verified release-candidate bundle (not published)'
    needs: packaged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the exact ZIP installed and tested in Stage 3
        uses: actions/download-artifact@v5
        with:
          name: validated-zip-install-windows
          path: candidate-input

      - name: Validate package and generate versioned candidate plus SHA256
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          ACTIONS_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import os
          from pathlib import Path
          import re
          import shutil
          import zipfile

          sources = list(Path('candidate-input').rglob('agentic-debugger-update-site-*.zip'))
          if len(sources) != 1:
              raise SystemExit(f'Expected exactly one tested update-site ZIP, found {len(sources)}')
          source = sources[0]
          prefix = 'org.learningfromexperience.eclipse.agentdebug'
          with zipfile.ZipFile(source) as archive:
              names = archive.namelist()
              if any(name.startswith('/') or '..' in Path(name).parts for name in names):
                  raise SystemExit('Unsafe paths in update-site ZIP')
              required = [
                  any(name in names for name in ('content.jar','content.xml','content.xml.xz')),
                  any(name in names for name in ('artifacts.jar','artifacts.xml','artifacts.xml.xz')),
              ]
              if not all(required):
                  raise SystemExit('Missing p2 metadata in tested ZIP')
              feature_pattern = re.compile(r'^features/' + re.escape(prefix) + r'\.feature_(\d+\.\d+\.\d+\.[A-Za-z0-9_-]+)\.jar$')
              plugin_pattern = re.compile(r'^plugins/' + re.escape(prefix) + r'_(\d+\.\d+\.\d+\.[A-Za-z0-9_-]+)\.jar$')
              features = [(n,feature_pattern.fullmatch(n)) for n in names if n.startswith('features/')]
              plugins = [(n,plugin_pattern.fullmatch(n)) for n in names if n.startswith('plugins/')]
              features = [(n,m) for n,m in features if m]
              plugins = [(n,m) for n,m in plugins if m]
              if len(features) != 1 or len(plugins) != 1:
                  raise SystemExit(f'Expected exactly one debugger feature and plugin; feature={len(features)} plugin={len(plugins)}')
              version = features[0][1].group(1)
              if plugins[0][1].group(1) != version:
                  raise SystemExit(f'Plugin/feature version mismatch: {plugins[0][1].group(1)} vs {version}')
              with zipfile.ZipFile(io.BytesIO(archive.read(plugins[0][0]))) as plugin:
                  manifest = plugin.read('META-INF/MANIFEST.MF').decode('utf-8')
                  manifest = re.sub(r'\r?\n ', '', manifest)
                  match = re.search(r'^Bundle-Version:\s*(\S+)', manifest, re.M)
                  if not match or match.group(1).strip() != version:
                      raise SystemExit(f'Plugin MANIFEST version does not match feature: {match.group(1) if match else "missing"}')

          out = Path('release-candidate')
          out.mkdir(exist_ok=True)
          destination = out / f'agentic-debugger-update-site-{version}.zip'
          shutil.copy2(source, destination)
          digest = hashlib.sha256(destination.read_bytes()).hexdigest()
          (out/'SHA256SUMS.txt').write_text(f'{digest}  {destination.name}\n', encoding='utf-8')
          original_version = source.name.removeprefix('agentic-debugger-update-site-').removesuffix('.zip')
          note = (
              '# Agentic Debugger for Eclipse — UNPUBLISHED release candidate\n\n'
              'Not a public release. Requires owner acceptance and validation against the approved development commit.\n\n'
              f'- Tested source commit: `{os.environ["SOURCE_SHA"]}`\n'
              f'- GitHub Actions evidence: {os.environ["ACTIONS_RUN"]}\n'
              f'- Eclipse feature and plugin version: `{version}`\n'
              f'- Download candidate: `{destination.name}`\n'
              f'- Original Maven build filename: `{source.name}`\n'
              f'- SHA-256: `{digest}`\n'
              '- Validated: Windows JDK 21/25 unit builds, FullSuite 43 tests, '
              'ZIP install/uninstall/reinstall and 21 post-reinstall tests.\n'
              '- Tested Eclipse: 2025-12 on Windows. Other operating systems are not certified by this run.\n\n'
              '## Local installation\n'
              'In Eclipse: Help → Install New Software → Add → Archive, then select the update-site ZIP.\n'
              'Install Agentic Debugger for Eclipse IDE and restart.\n\n'
              '## Release blockers still to resolve\n'
              '- Verify this candidate against the latest approved product code (main is still under development).\n'
              '- Complete manual Claude Code / GitHub Copilot acceptance, signing decision, and release approval.\n'
          )
          if original_version != version:
              print(f'::warning::Maven ZIP filename {original_version} disagrees with the feature version {version}. Candidate is renamed, but align the Maven versions before public release.')
              note += f'- Maven artifact version `{original_version}` differs from product version `{version}`. Align build versions before public release.\n'
          (out/'RELEASE_CANDIDATE.md').write_text(note, encoding='utf-8')
          print(f'Candidate: {destination.name} ({destination.stat().st_size} bytes)')
          print(f'SHA256: {digest}')
          print('Public release: DISABLED')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'### Release candidate prepared (NOT published)\n\n')
              summary.write(f'- Tested package: `{destination.name}`\n- SHA-256: `{digest}`\n')
              summary.write(f'- Source commit: `{os.environ["SOURCE_SHA"]}`\n')
              summary.write('- All 3 prior validation stages completed successfully.\n')
          PY

      - name: Upload verified candidate, checksum and release notes
        uses: actions/upload-artifact@v5
        with:
          name: release-candidate-validated
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30

  draft-preflight:
    name: 'Stage 5: Verify draft-release input and candidate (NO publication)'
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Stage 4 candidate
        uses: actions/download-artifact@v5
        with:
          name: release-candidate-validated
          path: release-draft-input

      - name: Independently verify release ZIP, checksum and metadata
        shell: bash
        env:
          CREATE_DRAFT: ${{ inputs.create_draft || 'false' }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re, zipfile
          root = pathlib.Path('release-draft-input')
          zips = list(root.glob('agentic-debugger-update-site-*.zip'))
          if len(zips) != 1:
              raise SystemExit(f'Expected exactly one validated ZIP; got {len(zips)}')
          archive = zips[0]
          sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          sums = (root / 'SHA256SUMS.txt').read_text(encoding='utf-8').strip()
          if sums != f'{sha}  {archive.name}':
              raise SystemExit('SHA256SUMS.txt does not match tested ZIP')
          notes = (root / 'RELEASE_CANDIDATE.md').read_text(encoding='utf-8')
          if os.environ['GITHUB_SHA'] not in notes:
              raise SystemExit('Release metadata does not identify this source commit')
          version = re.fullmatch(r'agentic-debugger-update-site-(\d+\.\d+\.\d+\.[A-Za-z0-9_-]+)\.zip', archive.name)
          if not version:
              raise SystemExit('Invalid versioned update-site ZIP filename')
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              if not any(n.startswith('features/') and n.endswith('.jar') for n in names):
                  raise SystemExit('No feature JAR')
              if not any(n.startswith('plugins/') and n.endswith('.jar') for n in names):
                  raise SystemExit('No plugin JAR')
              if not any(n in names for n in ('content.jar','content.xml','content.xml.xz')):
                  raise SystemExit('No p2 content metadata')
              if not any(n in names for n in ('artifacts.jar','artifacts.xml','artifacts.xml.xz')):
                  raise SystemExit('No p2 artifacts metadata')
          create = os.environ['CREATE_DRAFT'].lower() == 'true'
          tag = os.environ['RELEASE_TAG'].strip()
          if create:
              if os.environ['GITHUB_REF_NAME'] != 'main' or os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch':
                  raise SystemExit('Draft creation may only be manually requested on main')
              if not re.fullmatch(r'v\d+\.\d+\.\d+-(?:rc|preview)\.\d+', tag):
                  raise SystemExit('Draft tag must look like v1.5.0-preview.2 or v1.5.0-rc.1')
              base = '.'.join(version.group(1).split('.')[:3])
              if not tag.startswith('v' + base + '-'):
                  raise SystemExit(f'Tag {tag} does not match product version {base}')
          else:
              if tag:
                  print('Release tag ignored: draft creation is disabled')
          preview = (
              '# Agentic Debugger for Eclipse — release draft preview\n\n'
              'This is not a published GitHub Release. Review before publishing.\n\n'
              f'Commit: `{os.environ["GITHUB_SHA"]}`\n\n'
              f'Package: `{archive.name}`\n\n'
              f'SHA-256: `{sha}`\n\n'
              + notes
          )
          (root / 'DRAFT_RELEASE_NOTES.md').write_text(preview, encoding='utf-8')
          print(f'PASS: {archive.name}, {archive.stat().st_size} bytes, SHA-256 {sha}')
          print('Draft requested:', create)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as s:
              s.write('### Release draft preflight PASSED\n\n')
              s.write(f'- ZIP: `{archive.name}`\n- SHA-256 verified: `{sha}`\n')
              s.write(f'- Draft creation requested: **{create}**\n')
              s.write('- No public release is created by this stage.\n')
          PY

      - name: Upload draft-ready bundle (still NOT published)
        uses: actions/upload-artifact@v5
        with:
          name: release-draft-preflight
          path: release-draft-input/
          if-no-files-found: error
          retention-days: 30

  create-draft:
    # Manual, opt-in, main-only. This job is unreachable on ci/** push and PR events.
    # workflow_dispatch buttons appear only when this workflow is on the default branch.
    name: 'Stage 6: Create GitHub Release DRAFT (owner-invoked only)'
    needs: draft-preflight
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.create_draft == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download independently verified draft files
        uses: actions/download-artifact@v5
        with:
          name: release-draft-preflight
          path: release-draft-input

      - name: Create unpublished prerelease draft (never auto-publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cd release-draft-input
          shopt -s nullglob
          files=(agentic-debugger-update-site-*.zip)
          [[ ${#files[@]} -eq 1 ]] || { echo 'Expected exactly one ZIP'; exit 1; }
          sha256sum -c SHA256SUMS.txt
          # Never overwrite an existing tag or release, even when re-running a job.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG. Refusing to overwrite."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG. Refusing to overwrite."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${files[0]}" SHA256SUMS.txt RELEASE_CANDIDATE.md \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Agentic Debugger for Eclipse $RELEASE_TAG" \
            --notes-file DRAFT_RELEASE_NOTES.md \
            --draft --prerelease
          echo 'A GitHub Release DRAFT was created. It has NOT been published.'

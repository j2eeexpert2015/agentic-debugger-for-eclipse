# Installs the plugin into an actual Eclipse 2025-12 and runs debugger integration tests.
# PR jobs use GitHub's proposed merge commit, covering the newest main plus these workflows.
name: Integration tests (Windows)

on:
  push:
    branches: ['ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Integration suite to execute
        type: choice
        required: true
        default: RegressionSuite
        options:
          - RegressionSuite
          - FullSuite

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ECLIPSE_RELEASE: '2025-12'
  ECLIPSE_HOME: 'C:\ci\eclipse'
  BRIDGE_PORT: '21766'
  # CI branch pushes run all 43 tests; PRs default to the 21-test regression suite.
  TEST_SUITE: ${{ github.event_name == 'push' && 'FullSuite' || inputs.suite || 'RegressionSuite' }}

jobs:
  regression:
    name: ${{ github.event_name == 'push' && 'FullSuite' || inputs.suite || 'RegressionSuite' }} / Windows / Eclipse 2025-12
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Print tested revision
        shell: pwsh
        run: |
          git rev-parse HEAD
          Write-Host "Suite: $env:TEST_SUITE"
          java -version

      - name: Restore the test Eclipse from cache
        id: eclipse-cache
        uses: actions/cache/restore@v5
        with:
          path: C:\ci\eclipse
          key: eclipse-java-${{ env.ECLIPSE_RELEASE }}-R-win32-x86_64

      - name: Download test Eclipse (cache miss only)
        if: steps.eclipse-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "eclipse-java-$env:ECLIPSE_RELEASE-R-win32-x86_64.zip"
          $url = "https://download.eclipse.org/technology/epp/downloads/release/$env:ECLIPSE_RELEASE/R/$name"
          New-Item -ItemType Directory -Force -Path C:\ci | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "C:\ci\$name" -MaximumRetryCount 3 -RetryIntervalSec 10
          Expand-Archive -Path "C:\ci\$name" -DestinationPath C:\ci -Force
          Remove-Item "C:\ci\$name"
          if (-not (Test-Path "$env:ECLIPSE_HOME\eclipsec.exe")) { throw 'Eclipse installation missing eclipsec.exe' }

      - name: Save pristine test Eclipse to cache
        if: steps.eclipse-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: C:\ci\eclipse
          key: eclipse-java-${{ env.ECLIPSE_RELEASE }}-R-win32-x86_64

      - name: Write test-machine settings
        shell: pwsh
        run: |
          $repo = "${{ github.workspace }}".Replace('\', '/')
          $eclipse = $env:ECLIPSE_HOME.Replace('\', '/')
          @(
            '# Generated by the integration workflow. Never commit this file.',
            "repository=$repo",
            "eclipse=$eclipse",
            'workspace=${LOCALAPPDATA}/AgenticDebugger/java-e2e-workspace',
            "bridgePort=$env:BRIDGE_PORT"
          ) | Set-Content -Path dev-e2e/e2e.properties -Encoding ascii
          java dev-e2e/DevE2E.java config

      - name: Build for the test Eclipse
        shell: pwsh
        run: mvn -B -ntp clean package -DskipTests

      - name: Install plugin and start test Eclipse
        shell: pwsh
        run: java dev-e2e/DevE2E.java deploy --trace

      - name: Screenshot after start
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          try {
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save('ci-out/screen-after-start.png')
          } finally { $g.Dispose(); $bmp.Dispose() }

      - name: Integration tests
        shell: pwsh
        run: |
          mvn -B -ntp -pl testing verify -Pintegration-tests "-Dit.test=$env:TEST_SUITE" '-Dfixture.post.approved=true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Failsafe's suite launcher XML can say 0 even though underlying tests ran.
      # Use failsafe-summary.xml for actual totals; don't publish a misleading 0-test table.
      - name: Verify integration results and publish summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $summaryPath = 'testing/target/failsafe-reports/failsafe-summary.xml'
          if (-not (Test-Path $summaryPath)) { throw 'No Failsafe summary. Integration tests did not run.' }
          $summary = ([xml](Get-Content -Raw $summaryPath)).'failsafe-summary'
          if ($null -eq $summary) { throw 'Malformed Failsafe summary.' }
          $completed = [int]$summary.completed
          $failures = [int]$summary.failures
          $errors = [int]$summary.errors
          $skipped = [int]$summary.skipped
          $minimum = if ($env:TEST_SUITE -eq 'FullSuite') { 43 } else { 21 }
          @(
            "### $env:TEST_SUITE on Windows / Eclipse $env:ECLIPSE_RELEASE",
            '',
            '| Completed | Failures | Errors | Skipped | Minimum expected |',
            '|---:|---:|---:|---:|---:|',
            "| $completed | $failures | $errors | $skipped | $minimum |",
            '',
            'Individual scenarios appear in the test job log; diagnostic reports are uploaded as artifacts.'
          ) | Tee-Object -Variable summaryLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $summaryLines | ForEach-Object { Write-Host $_ }
          if ($completed -lt $minimum -or $failures -ne 0 -or $errors -ne 0 -or $skipped -ne 0) {
            throw "Integration results invalid: completed=$completed minimum=$minimum failures=$failures errors=$errors skipped=$skipped"
          }

      - name: Screenshot at the end
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          try {
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save('ci-out/screen-at-end.png')
          } finally { $g.Dispose(); $bmp.Dispose() }

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-out | Out-Null
          $ws = Join-Path $env:LOCALAPPDATA 'AgenticDebugger\java-e2e-workspace'
          if (Test-Path "$ws\.metadata\.log") { Copy-Item "$ws\.metadata\.log" ci-out\eclipse-workspace.log }
          Copy-Item dev-e2e\target\*.log ci-out\ -ErrorAction SilentlyContinue
          if (Test-Path testing\target\failsafe-reports) { Copy-Item testing\target\failsafe-reports ci-out\failsafe-reports -Recurse }
          Get-ChildItem ci-out -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload logs, test reports, screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-windows-logs-${{ github.run_attempt }}
          path: ci-out/
          if-no-files-found: warn
          retention-days: 14

      - name: Close the test Eclipse
        if: always()
        continue-on-error: true
        shell: pwsh
        run: Get-Process eclipse -ErrorAction SilentlyContinue | Stop-Process -Force
